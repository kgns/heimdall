# heimdall-probe configuration for a CPE. Copy to /misc/heimdall/config.yaml.
# Every key is optional; omitted keys keep the built-in defaults shown here.

# Device ID used in every sample. Defaults to the lowercased hostname.
device: ex7501-home

runtime:
  gomaxprocs: 1          # overridden by the GOMAXPROCS environment variable
  memory_limit: 48MiB    # Go soft memory limit; overridden by GOMEMLIMIT
  nice: 10               # lower CPU priority than the router's own daemons

scheduler:
  max_pps: 100           # hard cap on probes per second across all targets
  burst: 10

icmp:
  mode: auto             # auto | raw | dgram
  interval: 1s
  timeout: 2s
  payload_size: 32

tcp:                     # connect, then abort with RST
  interval: 10s
  timeout: 3s
  port: 443

http:                    # one HTTPS GET on a fresh connection, no redirects
  interval: 60s
  timeout: 10s
  max_body: 32KiB
  user_agent: ""         # default: heimdall-probe/<version> (latency measurement)

# STAMP (RFC 8762) test packets to targets with protocols [stamp]: round
# trip without the reflector's turnaround, one-way delays, forward hop count
# and whether losses happened on the way out or back.
stamp:
  interval: 1s
  timeout: 2s
  port: 862

# udp (datagram echo, for example the GameLift ping beacons) and stun (STUN
# Binding requests, which also report the CGNAT public mapping) probes.
udp:
  interval: 5s
  timeout: 2s

# ICMP traceroutes (kind trace), one every interval, to the targets in turn:
# about every 30 minutes per destination with ~60 destinations. All TTLs
# are probed concurrently, gap apart. Needs a raw ICMP socket.
trace:
  interval: 30s
  max_hops: 24
  probes: 2
  timeout: 2s
  gap: 20ms

# On-probe detection. Each (target, kind, destination) series learns a
# baseline of its per-minute median and loss over about an hour, after
# warmup; minutes well above it become anomalies, and anomalies are grouped
# into incidents (event incident_start/update/end) scoped to the access
# network (access_services, or a large share of all services at once), one
# service, or DNS. The cloud notifier posts them to Slack.
detect:
  enabled: true
  warmup: 15m
  access_services: [isp-hop, isp-gateway]

# Discoverers named in the catalog find the servers a service really uses:
# the YouTube and Netflix caches this line is mapped to, the nearest Steam
# relays (by distance from lat/lon), Discord voice regions, GameLift ping
# beacons and the services' STUN servers. Each fills targets
# "<service>/<discoverer>/<n>" and re-runs every interval.
discovery:
  enabled: true
  interval: 1h
  timeout: 20s
  lat: 41.01
  lon: 28.98
  gamelift_regions: [eu-central-1, eu-south-1, il-central-1, eu-west-1]

# Layered DNS probes. The local and upstream layers are discovered from the
# running dnsmasq (or resolv.conf without it). uncached_zone is a wildcard
# zone: a random label under it is resolved through the full path on every
# probe. DoH servers are reached at a fixed IP and compared against the
# system path. identity reveals which resolver answers for the system path:
# zone is a whoami zone queried with random labels (always current); names
# are fixed whoami records, used only when no zone is set.
dns:
  enabled: true
  interval: 30s
  timeout: 3s
  names: [www.google.com, www.wikipedia.org]
  local: true
  upstreams: true
  uncached_zone: w.lat.kgns.dev
  doh:
    - {id: google,     url: https://dns.google/dns-query,         ip: 8.8.8.8}
    - {id: cloudflare, url: https://cloudflare-dns.com/dns-query, ip: 1.1.1.1}
  identity:
    interval: 60s
    names: [whoami.ds.akahelp.net, o-o.myaddr.l.google.com]
    zone: w.lat.kgns.dev

# Targets whose route leaves through an interface other than the default
# route's (for example an operator management VLAN) are never probed.
#
# ttl: N sends the echo request towards ip with IP TTL N and measures the
# router at hop N, which answers with ICMP time exceeded. Use it for ISP
# routers that ignore echo requests addressed to themselves (common for the
# PPP peer). It needs a raw ICMP socket. auto: gateway pings the default
# route's next hop directly instead.
targets:
  - {id: isp-hop1,       category: infra, service: isp-hop,     ip: 1.1.1.1, ttl: 1}
  - {id: isp-hop2,       category: infra, service: isp-hop,     ip: 1.1.1.1, ttl: 2}
  - {id: isp-hop3,       category: infra, service: isp-hop,     ip: 1.1.1.1, ttl: 3}
  - {id: cloudflare-dns, category: infra, service: cloudflare,  ip: 1.1.1.1}
  - {id: google-dns,     category: infra, service: google,      ip: 8.8.8.8}
  - {id: quad9-dns,      category: infra, service: quad9,       ip: 9.9.9.9}
  # Root servers that every RIPE Atlas probe pings (built-in measurements
  # 1001 and 1004), so this line can be compared with other lines of the
  # same ISP.
  - {id: k-root,         category: infra, service: k-root,      ip: 193.0.14.129}
  - {id: f-root,         category: infra, service: f-root,      ip: 192.5.5.241}
  # heimdall-reflector in AWS eu-central-1 (terraform/reflector.tf).
  - {id: aws-reflector,  category: infra, service: aws-reflector, host: reflector.lat.kgns.dev, protocols: [icmp, tcp, stamp]}

# Service catalog. Each host becomes a target "<service>/<host>", resolved
# through the system resolver (on the CPE: dnsmasq and whatever it forwards
# to) and re-resolved every resolve_interval. Leave path empty to disable.
catalog:
  path: /misc/heimdall/catalog/targets.yaml
  regions: [tr]          # loads regions/<name>.yaml next to path
  only: []               # keep only these service IDs or categories
  exclude: []            # drop these service IDs or categories
  resolve_interval: 5m
  resolve_timeout: 5s

output:
  stdout: false
  jsonl:                 # local debug copy; keep it on tmpfs, never on flash
    enabled: true
    dir: /var/tmp/heimdall
    max_file_size: 2MiB
    max_files: 2

# Upload to the ingest API. The token file holds the device's bearer token
# (scripts/new-device-token creates one); keep it mode 0600.
upload:
  enabled: false
  url: https://ingest.lat.kgns.dev/v1/batch
  token_file: /misc/heimdall/upload.token
  interval: 10s
  timeout: 15s
  buffer: 16MiB          # held in memory during outages, oldest dropped first
  max_batch: 2000
  max_batch_bytes: 3MiB
  heartbeat: 60s
  drain_on_stop: 5s

# Context recorded next to the measurements. A zero interval disables a
# collector.
collectors:
  wan:                   # throughput of the default-route interface
    interval: 1s
  cpu:                   # CPU states, load and UDP/TCP/ICMP error counters
    interval: 1s
  lan:                   # ping LAN clients to separate Wi-Fi from WAN problems
    enabled: true
    interval: 5s
    discover_interval: 30s
    max_clients: 32
    interfaces: ["br*"]
    # Clients are identified by HMAC(salt, MAC). The salt is created on
    # first start; keep it to keep client IDs stable across restarts.
    salt_file: /misc/heimdall/lan.salt
    use_leases: false    # leases outlive devices; ARP shows who is actually there
    disappear_after: 3   # missed discoveries before a client counts as gone
    # Echo requests sent back to back per client. A Wi-Fi client in power
    # save answers the first only after it wakes for a beacon; the sample
    # keeps the best of the rest and lists all of them in burst_ms.
    burst: 1
  flows:                 # split each client connection into LAN and WAN round trips
    enabled: false
    interface: br0       # the LAN bridge; needs CAP_NET_RAW
    # How much of the destination is reported: category (streaming, ...),
    # service (netflix, ...) or raw, which adds the server name and
    # address and the client's address and port. Use raw only on your
    # own network.
    names: service
    max_per_minute: 1200 # flow samples per minute; the rest are only counted
    receive_buffer: 512KiB
  wifi:                  # radio and station statistics through Broadcom wl
    interval: 0s         # 0 is off; 10s is a good value
    command: wl
    timeout: 3s          # per wl call
    # EasyMesh topology written by the CPE: extender clients and backhaul.
    mesh_file: /tmp/zy1905.json
  processes:             # daemons on the DNS path, with container memory
    interval: 30s
    names: [dnsmasq, dnscrypt-proxy]
  clock:                 # SNTP offset; the clock itself is never changed
    interval: 60s
    server: time.cloudflare.com
    timeout: 3s

self_metrics:
  interval: 60s

netwatch:
  interval: 10s          # default route / WAN address re-check
