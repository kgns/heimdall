[project]
name = "heimdall-cloud"
version = "0.1.0"
description = "Cloud side of heimdall: sample ingest, detection and analysis"
requires-python = ">=3.13"
# The ingest Lambda runs on the AWS Python runtime, which provides boto3;
# the deployed code itself has no third-party dependencies.
dependencies = []

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3==1.43.118",
    "moto[dynamodb,firehose,ssm]==5.2.4",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
