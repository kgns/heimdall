domain=home
bogus-priv
interface=br*
dhcp-authoritative
read-ethers
dhcp-range=tag:!subnet,tag:br0,192.168.1.2,192.168.1.254,86400
dhcp-option=tag:!subnet,tag:br0,6,192.168.1.1
dhcp-range=tag:!subnet,tag:brts1,192.168.251.2,192.168.251.254,86400
dhcp-option=tag:!subnet,tag:brts1,6,192.168.251.1
dhcp-range=tag:!subnet,tag:br2,192.168.3.2,192.168.3.254,86400
dhcp-option=tag:!subnet,tag:br2,6,192.168.3.1
dhcp-vendorclass=set:stb,MSFT_IPTV
dhcp-option=stb,15,
dhcp-option=252,"\n"
dhcp-leasefile=/var/dnsmasq/dnsmasq.leases
